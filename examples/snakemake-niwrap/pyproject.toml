[project]
name = "snakemake-niwrap"
version = "0.0.0"
description = "Demo of NiWrap using the Snakemake workflow engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["niwrap>=1.0.4", "snakemake>=9.23.1"]

[build-system]
requires = ["uv_build>=0.8.13,<0.10.0"]
build-backend = "uv_build"
