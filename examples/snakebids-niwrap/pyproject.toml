[project]
name = "snakebids-niwrap"
version = "0.0.0"
description = "Demo of NiWrap using Snakebids"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["niwrap>=1.0.4", "snakebids>=0.15.0"]

[project.scripts]
snakebids-niwrap = "snakebids_niwrap.run:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.10.0"]
build-backend = "uv_build"
