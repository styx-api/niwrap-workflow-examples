[project]
name = "dagster-niwrap"
version = "0.0.0"
description = "Demo of NiWrap using Dagster"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["dagster>=1.9.0", "dagster-webserver>=1.9.0", "niwrap>=1.0.4"]

[build-system]
requires = ["uv_build>=0.8.13,<0.10.0"]
build-backend = "uv_build"

[tool.dagster]
module_name = "dagster_niwrap"
code_location_name = "dagster_niwrap"

[tool.ruff.lint.isort]
known-first-party = ["dagster_niwrap"]
