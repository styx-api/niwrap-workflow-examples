[project]
name = "niwrap-workflow-examples"
version = "0.0.0"
description = "Examples of NiWrap used with different workflow engines."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering"
]
dependencies = []

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "prek>=0.4.5",
  "ruff>=0.15.20",
  "snakefmt>=2.0.3",
  "ty>=0.0.55"
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["examples/*"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "C90",  # mccabe
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "ERA",  # eradicate
  "F",  # Pyflakes
  "FA",  # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FURB",  # refurb
  "I",  # isort
  "N",  # pep8-naming
  "NPY",  # NumPy-specific rules
  "PD",  # pandas-vet
  "PERF",  # Perflint
  "PIE",  # flake8-pie
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RUF",  # Ruff-specific rules
  "S",  # flake8-bandit
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "TID",  # flake8-tidy-imports
  "TC",  # flake8-type-checking
  "UP"  # pyupgrade
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
  "dagster_niwrap",
  "nextflow_niwrap",
  "snakebids_niwrap",
  "snakemake_niwrap"
]

[tool.ruff.lint.per-file-ignores]

[tool.ty]
